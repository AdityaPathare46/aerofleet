apiVersion: v1
kind: Namespace
metadata:
  name: aerofleet

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aerofleet-config
  namespace: aerofleet
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  DATABASE_URL: "postgresql://aerofleet:changeme@postgres-service:5432/aerofleet"

---
apiVersion: v1
kind: Secret
metadata:
  name: aerofleet-secrets
  namespace: aerofleet
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
  SECRET_KEY: "your-secret-key-here"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aerofleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "aerofleet"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aerofleet-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "aerofleet"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: aerofleet
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: aerofleet
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aerofleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: aerofleet
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerofleet-api
  namespace: aerofleet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aerofleet-api
  template:
    metadata:
      labels:
        app: aerofleet-api
    spec:
      containers:
      - name: api
        image: your-registry/aerofleet-api:latest
        envFrom:
        - configMapRef:
            name: aerofleet-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aerofleet-secrets
              key: SECRET_KEY
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: aerofleet-api-service
  namespace: aerofleet
spec:
  selector:
    app: aerofleet-api
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aerofleet-api-hpa
  namespace: aerofleet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aerofleet-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
