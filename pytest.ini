[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=aerofleet --cov-report=html --cov-report=term-missing --strict-markers -m "not hardware and not property"

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests (> 1s)
    requires_ollama: Tests requiring Ollama server to be running
    requires_spice: Tests requiring SPICE kernels to be available
    requires_network: Tests requiring network connectivity
    hardware: Tests exercising the real MAVLink wire protocol (spawns tools/mock_mavlink_vehicle.py); excluded from the default fast run
    property: Property-based tests generating many cases from real data (tests/property/) — correct and valuable, but 3,000+ cases would blow up the default run's "quick check" promise; excluded from it, run explicitly instead

[coverage:run]
source = aerofleet
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */datasets/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
